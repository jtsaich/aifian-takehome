<text x="24" y="34" font-size="18" font-weight="bold" text-anchor="start" fill="#1d2329">老闆要的會員 App，每一塊畫面要靠什麼撐起來</text>
<text x="24" y="56" font-size="12.5" font-weight="normal" text-anchor="start" fill="#5d6770">左：會員 App 示意畫面（假資料）　右：這一塊要能運作需要什麼，以及第一階段的哪件事在準備它</text>
