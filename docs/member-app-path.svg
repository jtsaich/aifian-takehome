<text x="78" y="236" font-size="11.5" font-weight="normal" text-anchor="start" fill="#5d6770">結帳時出示會員條碼</text>
<rect x="64" y="260" width="252" height="92" rx="12" fill="#ffffff" stroke="#c8d0d6" stroke-width="1.2"/>
<text x="78" y="282" font-size="13" font-weight="bold" text-anchor="start" fill="#1d2329">我的喜餅訂單</text>
<text x="78" y="302" font-size="12" font-weight="normal" text-anchor="start" fill="#1d2329">11/28 取貨｜龍鳳喜餅 80 盒</text>
<text x="78" y="322" font-size="12" font-weight="normal" text-anchor="start" fill="#5d6770">單號 0123｜已確認｜中正店</text>
<rect x="64" y="364" width="252" height="92" rx="12" fill="#ffffff" stroke="#c8d0d6" stroke-width="1.2"/>
<text x="78" y="386" font-size="13" font-weight="bold" text-anchor="start" fill="#1d2329">為您推薦</text>
<text x="78" y="406" font-size="12" font-weight="normal" text-anchor="start" fill="#1d2329">彌月禮盒 會員價 9 折</text>
<text x="78" y="426" font-size="12" font-weight="normal" text-anchor="start" fill="#5d6770">喜餅客人專屬</text>
<rect x="64" y="468" width="252" height="78" rx="12" fill="#ffffff" stroke="#c8d0d6" stroke-width="1.2"/>
<text x="78" y="490" font-size="13" font-weight="bold" text-anchor="start" fill="#1d2329">生日月禮</text>
<text x="78" y="510" font-size="12" font-weight="normal" text-anchor="start" fill="#1d2329">$100 折價券，本月可用</text>
<rect x="440" y="149.0" width="650" height="92" rx="10" fill="#ffffff" stroke="#c8d0d6" stroke-width="1.2"/>
<text x="456" y="171.0" font-size="14" font-weight="bold" text-anchor="start" fill="#2471a3">會員卡、點數</text>
<text x="456" y="193.0" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d2329">需要：門市結帳時，POS 要知道是哪位會員買的</text>
<text x="456" y="213.0" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1d2329">第 1 週：把「結帳記下會員」的需求交給 POS 廠商</text>
<text x="456" y="231.0" font-size="11.5" font-weight="normal" text-anchor="start" fill="#5d6770">廠商改功能一個月起跳，現在提，第 4–6 週才接得上</text>
<path d="M316,195.0 L440,195.0" fill="none" stroke="#1d2329" stroke-width="1.2" marker-end="url(#m)"/>
<rect x="440" y="260.0" width="650" height="92" rx="10" fill="#ffffff" stroke="#c8d0d6" stroke-width="1.2"/>
<text x="456" y="282.0" font-size="14" font-weight="bold" text-anchor="start" fill="#2471a3">我的喜餅訂單</text>
<text x="456" y="304.0" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d2329">需要：每一張喜餅訂單正確、有單號，改單有紀錄</text>
<text x="456" y="324.0" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1d2329">第 1 週：統一訂單表格＋官方帳號自動檢查，先在 1–2 家門市</text>
<text x="456" y="342.0" font-size="11.5" font-weight="normal" text-anchor="start" fill="#5d6770">客人在 App 上看到的訂單，跟門市、廚房是同一份</text>
<path d="M316,306.0 L440,306.0" fill="none" stroke="#1d2329" stroke-width="1.2" marker-end="url(#m)"/>
<rect x="440" y="364.0" width="650" height="92" rx="10" fill="#ffffff" stroke="#c8d0d6" stroke-width="1.2"/>
<text x="456" y="386.0" font-size="14" font-weight="bold" text-anchor="start" fill="#2471a3">回購推薦</text>
<text x="456" y="408.0" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d2329">需要：同一位客人的歷史訂單對得起來（用電話）</text>
<text x="456" y="428.0" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1d2329">第 2–3 週：客人資料、舊訂單匯入</text>
<text x="456" y="446.0" font-size="11.5" font-weight="normal" text-anchor="start" fill="#5d6770">喜餅客人之後買彌月、節慶禮盒，才推得準時間點</text>
<path d="M316,410.0 L440,410.0" fill="none" stroke="#1d2329" stroke-width="1.2" marker-end="url(#m)"/>
<rect x="440" y="461.0" width="650" height="92" rx="10" fill="#ffffff" stroke="#c8d0d6" stroke-width="1.2"/>
<text x="456" y="483.0" font-size="14" font-weight="bold" text-anchor="start" fill="#2471a3">生日禮、推播、客服</text>
<text x="456" y="505.0" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1d2329">需要：有人處理會員的問題、查點數、發券</text>
<text x="456" y="525.0" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1d2329">第 1 週起：系統接手彙整與核對，空出總部人力</text>
<text x="456" y="543.0" font-size="11.5" font-weight="normal" text-anchor="start" fill="#5d6770">會員上線後多出來的工作，由空出來的人力接手</text>
<path d="M316,507.0 L440,507.0" fill="none" stroke="#1d2329" stroke-width="1.2" marker-end="url(#m)"/>
<text x="24" y="618" font-size="12" font-weight="normal" text-anchor="start" fill="#5d6770">大品牌的做法（查了 12 家會員條款）：10 家有點數、8 家有生日禮、5 家用自家 App 條碼在門市辨識會員。這些功能都要靠結帳時記得是誰買的。</text>
