# Local dev: `docker compose up --build`, then open http://localhost:8000
# Mirrors production: `init` runs `bakery-init` once (a Cloud Run job in production),
# then `app` serves the same image.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bakery
      POSTGRES_PASSWORD: bakery
      POSTGRES_DB: bakery
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakery -d bakery"]
      interval: 2s
      timeout: 3s
      retries: 30

  init:
    build: .
    image: bakery-orders:local
    command: ["bakery-init"]
    environment:
      DATABASE_URL: postgresql://bakery:bakery@db:5432/bakery
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: bakery-orders:local
    environment:
      DATABASE_URL: postgresql://bakery:bakery@db:5432/bakery
      # Full links in replies (廚房彙總：http://localhost:8000/kitchen), as LINE needs.
      # When testing a real LINE group locally, set it to the tunnel URL in .env.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${APP_PORT:-8000}}
      # Messaging API channel keys, read from .env (gitignored). Unset: webhook answers 503.
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
    ports:
      - "${APP_PORT:-8000}:8080"
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  pgdata:
