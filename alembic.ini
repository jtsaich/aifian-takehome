# For `uv run alembic ...` (new revisions, history). The URL comes from DATABASE_URL.
# Linear history: one migration per ticket, named NNNN_<slug>, e.g.
#   uv run alembic revision --autogenerate --rev-id 0002 -m "change_log"
[alembic]
script_location = bakery:migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
